studio.welcomeTitle:
  en: "What this does"
  fr: "Ce que fait l'atelier"
studio.welcome1:
  en: "The search builds a model of your series from a handful of pieces (a smooth trend, a straight line, a repeating cycle, noise, a change of regime) and keeps the combination that explains the data best for its size."
  fr: "La recherche construit un modèle de votre série avec quelques pièces (une tendance lisse, une droite, un cycle, du bruit, un changement de régime) et garde la combinaison qui explique le mieux les données pour sa taille."
studio.welcome2:
  en: "Each piece then gets a sentence, a chart and a check. Tell it what you already know (a weekly cycle, the date of a promotion) and it reports what it found against that."
  fr: "Chaque pièce reçoit ensuite une phrase, un graphique et une vérification. Dites-lui ce que vous savez déjà (un cycle hebdomadaire, la date d'une promotion) : il rend compte de ce qu'il a trouvé par rapport à cela."
