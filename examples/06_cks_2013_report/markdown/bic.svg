<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Roboto, system-ui, sans-serif" role="img" aria-labelledby="loss-title loss-desc">
<title id="loss-title">BIC per search level</title>
<desc id="loss-desc">Loss per epoch for BIC over 12 epochs. BIC reaches its minimum of 1112 at epoch 10; the 2 epochs after it are shaded, and over them the loss rises rather than falls.</desc>
<style>.ep{cursor:default;}.ep:hover,.ep:focus{outline:none;}.tip{opacity:0;pointer-events:none;transition:opacity .12s ease}#ep-0:hover~#eptip-0,#ep-0:focus~#eptip-0{opacity:1}@media (prefers-reduced-motion:reduce){.tip{transition:none}}</style>
